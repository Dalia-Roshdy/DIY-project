<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DIY AC Repair">

  <script>
(async function () {
  const version = 'diy-ac-v13-2';
  const versionKey = 'diy_ac_app_version';

  if (localStorage.getItem(versionKey) === version) return;

  try {
    if ('serviceWorker' in navigator) {
      const registrations =
          await navigator.serviceWorker.getRegistrations();

      await Promise.all(
        registrations.map(registration => registration.unregister())
      );
    }

    if ('caches' in window) {
      const cacheNames = await caches.keys();

      await Promise.all(
        cacheNames.map(cacheName => caches.delete(cacheName))
      );
    }

    localStorage.setItem(versionKey, version);
    window.location.reload();
  } catch (error) {
    console.error('App cache cleanup failed:', error);
  }
})();
</script>

  

  <!-- Favicon -->
  <link rel="icon" href="New_Screen_3_(Copy).png" sizes="any"/>
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="DIY AC Repair" />
  <meta property="og:description" content="Built with FlutterFlow." />
  <meta property="og:image" content="/assets/assets/images/AYK_Logo.jpg" /> 
  <meta name="twitter:title" content="DIY AC Repair" />
  <meta name="twitter:description" content="Built with FlutterFlow." />
  <meta name="twitter:image" content="/assets/assets/images/AYK_Logo.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> DIY AC Repair </title>
  <meta name="description" content="Built with FlutterFlow." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#f1f4f8">

  <link rel="manifest" href="manifest.json">
  
</head>
